<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/novamedia_icon.gif">
    <link rel="stylesheet" href="css/main.css">
    <title>NOVA MEDIA</title>
    <script>
      // Hide splash immediately (before CSS/JS render) when ?splash=false is set.
      // This inline script runs synchronously in <head>, eliminating any flash.
      if (new URLSearchParams(window.location.search).get('splash') === 'false') {
        document.write('<style>#splash{display:none!important}</style>');
      }
    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/script.js"></script>
</head>

<body style="overflow: hidden;">
    <!-- Landing Logo (Fixed) -->
    <a href="index.html?splash=false">
        <img src="images/novamedia_logo.webp" alt="NOVA MEDIA" class="landing-logo">
    </a>

    <!-- ── SPLASH SECTION ── -->
    <section id="splash">
   
      <!-- Video stage: two video elements swap between each other -->
      <div id="video-stage">
        <video id="vid-a" muted playsinline preload="auto" class="active"></video>
        <video id="vid-b" muted playsinline preload="auto"></video>
      </div>
   
      <!-- Overlay UI on top of the video -->
      <div id="splash-overlay">
        <div id="splash-content">
          <img src="images/novamedia_logo.webp" alt="NOVA MEDIA" id="splash-logo">
          <p id="splash-sub">Focusing on immersive experiences through audio and video</p>
        </div>
   
        <div id="enter-text">CHECK OUR WORK ↓</div>
        <div id="splash-bottom-right-ui">
          <div id="splash-tag"></div>
          <div id="progress-dots"></div>
        </div>
      </div>
   
      <!-- Loading bar shown while first clip is fetching -->
      <div id="loading-bar"><div id="loading-fill"></div></div>
   
    </section>

    <div class="desktop">
        <div class="header">
            <div class="column title">
                <a href="index.html?splash=false">
                    <img src="images/novamedia_logo.webp" alt="nova icon" class="header-logo">
                </a>
            </div>
            <div id="tags" class="row header-tags">
                <span id="current-tag"></span>
            </div>
            <div class="row header-nav">
                <a href="index.html?splash=false">HOME</a>
            </div>
            <div class="row header-nav">
                <a href="about.html">ABOUT</a>
            </div>
            <div class="row header-nav">
                <a href="contact.html">CONTACT</a>
            </div>
        </div>
    </div>
    <div class="mobile">
        <div class="header">
            <div class="column title">
                <a href="index.html?splash=false">
                    <img src="images/novamedia_logo.webp" alt="nova icon" class="header-logo">
                </a>
            </div>
            <div class="row header-nav-mobile">
                <a href="index.html?splash=false">HOME </a>
                <div class="header-nav-spacer"> </div>
                <a href="about.html">ABOUT </a>
                <div class="header-nav-spacer"> </div>
                <a href="contact.html">CONTACT</a>
            </div>
        </div>
        <g id="tags-mobile" class="sub-header">
            <span id="current-tag-mobile"></span>
        </g>
    </div>
    <div class="main-content">
        <div class="sidebar">
            <div class="main-porjects"></div>
            <div id="project-list"></div>
            <div id="image-gallery">
                <div class="image-container" id="gallery-image"></div>
            </div>
        </div>
    </div>

    <div class="row footer" style="font-weight: 400;">© 2026</div>

    </div>
</body>

</html>
